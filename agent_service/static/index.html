<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Agent — AI Hub</title>
<style>
  :root {
    --bg:#0B0F14; --panel:#10161D; --raised:#151D26; --hover:#1A2430;
    --line:#1E2933; --line-soft:#18212B;
    --text:#E4ECF3; --text2:#93A2B0; --text3:#5C6B7A;
    --accent:#41D0C1; --accent-ink:#0B0F14;
    --accent-tint:rgba(65,208,193,.12); --accent-line:rgba(65,208,193,.35);
    --amber:#E5B663; --red:#E0716B;
    --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;
       line-height:1.55;color-scheme:dark;display:flex;flex-direction:column}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  header{display:flex;align-items:center;gap:12px;padding:14px 22px;
         border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  .mark{width:28px;height:28px;border-radius:8px;flex:none;
        background:linear-gradient(135deg,var(--accent),#2A8F86);
        display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:14px}
  .title{font-weight:650;font-size:15px;letter-spacing:-.01em}
  .badge{font-family:var(--mono);font-size:9px;letter-spacing:.09em;color:var(--accent);
         border:1px solid var(--accent-line);border-radius:999px;padding:2px 8px}
  .who{margin-left:auto;font-size:12px;color:var(--text3)}
  .who b{color:var(--text2);font-weight:550}
  .newchat{border:1px solid var(--line);border-radius:8px;padding:5px 12px;
           color:var(--text2);font-size:12px}
  .newchat:hover{border-color:var(--accent-line);color:var(--text)}

  main{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .thread{max-width:820px;margin:0 auto;padding:26px 20px 40px;display:flex;
          flex-direction:column;gap:16px}

  .hello{color:var(--text2);text-align:center;margin-top:9vh}
  .hello h1{font-size:22px;font-weight:650;color:var(--text);letter-spacing:-.01em;margin-bottom:8px}
  .hello p{max-width:52ch;margin:0 auto 18px}
  .starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .starter{border:1px solid var(--line);background:var(--panel);border-radius:999px;
           padding:7px 14px;font-size:12.5px;color:var(--text2)}
  .starter:hover{border-color:var(--accent-line);color:var(--text)}

  .msg{display:flex;flex-direction:column;gap:6px;animation:rise .18s ease}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.msg{animation:none}}
  .au{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text3);
      text-transform:uppercase}
  .msg.user{align-items:flex-end}
  .msg.user .bubble{background:var(--accent-tint);border:1px solid var(--accent-line);
                    border-radius:14px 14px 4px 14px;max-width:70%}
  .msg.agent .bubble{background:var(--panel);border:1px solid var(--line);
                     border-radius:14px 14px 14px 4px;max-width:88%}
  .bubble{padding:11px 15px;white-space:pre-wrap;overflow-wrap:anywhere}
  .bubble code, .bubble pre{font-family:var(--mono);font-size:12.5px}

  .toolchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);
            font-size:10.5px;color:var(--text3);border:1px solid var(--line-soft);
            border-radius:7px;padding:4px 10px;background:var(--raised);max-width:88%;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toolchip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .meta{font-family:var(--mono);font-size:9.5px;color:var(--text3)}
  .meta.err{color:var(--red)}

  .thinking{display:inline-flex;gap:5px;padding:12px 15px}
  .thinking i{width:6px;height:6px;border-radius:50%;background:var(--text3);
              animation:pulse 1.1s ease-in-out infinite}
  .thinking i:nth-child(2){animation-delay:.18s}
  .thinking i:nth-child(3){animation-delay:.36s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  footer{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:14px 20px}
  .inputrow{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:12px;
           color:var(--text);font:inherit;padding:11px 14px;resize:none;min-height:44px;
           max-height:160px;outline:none}
  textarea:focus{border-color:var(--accent-line)}
  textarea::placeholder{color:var(--text3)}
  .send{background:var(--accent);color:var(--accent-ink);font-weight:650;border-radius:11px;
        padding:11px 20px;flex:none}
  .send:disabled{opacity:.4;cursor:default}
  .foot-note{max-width:820px;margin:8px auto 0;font-size:10.5px;color:var(--text3);
             font-family:var(--mono);display:flex;justify-content:space-between}

  .gate{margin:12vh auto 0;max-width:420px;text-align:center;color:var(--text2)}
  .gate h1{font-size:18px;color:var(--text);margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="mark">A</div>
  <span class="title">The Agent</span>
  <span class="badge">AI HUB · PREVIEW</span>
  <span class="who" id="who"></span>
  <button class="newchat" id="newchat" title="Start a fresh conversation">New chat</button>
</header>

<main id="main"><div class="thread" id="thread"></div></main>

<footer>
  <div class="inputrow">
    <textarea id="input" rows="1" placeholder="Ask about your data, connections, playbooks…"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="foot-note"><span id="model"></span><span>read-only preview · nothing is changed without you</span></div>
</footer>

<script>
(() => {
  // ---- token handling: arrive via /the-agent redirect with ?token= ----
  const params = new URLSearchParams(location.search);
  if (params.get("token")) {
    localStorage.setItem("agent_token", params.get("token"));
    history.replaceState({}, "", location.pathname);
  }
  const token = () => localStorage.getItem("agent_token") || "";

  const thread = document.getElementById("thread");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const mainEl = document.getElementById("main");
  let sessionId = sessionStorage.getItem("agent_session") || null;
  let busy = false;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function scroll() { mainEl.scrollTop = mainEl.scrollHeight; }

  function gate(msg) {
    thread.innerHTML = "";
    const g = el("div", "gate");
    g.appendChild(el("h1", "", "Open The Agent from AI Hub"));
    g.appendChild(el("p", "", msg));
    thread.appendChild(g);
    input.disabled = true; send.disabled = true;
  }

  function hello(user) {
    const h = el("div", "hello");
    h.id = "hello";
    h.appendChild(el("h1", "", `Hi ${user.name || user.username || "there"} — what do you need?`));
    h.appendChild(el("p", "", "I can explore your data connections, inspect schemas, run read-only checks, ask your data agents questions, and show you your playbooks and run history."));
    const s = el("div", "starters");
    [["What data connections do we have?"],
     ["Show me the playbooks that exist"],
     ["What ran recently, and did anything fail?"]].forEach(([q]) => {
      const b = el("button", "starter", q);
      b.onclick = () => { input.value = q; sendMsg(); };
      s.appendChild(b);
    });
    h.appendChild(s);
    thread.appendChild(h);
  }

  function addUser(text) {
    const m = el("div", "msg user");
    m.appendChild(el("span", "au", "You"));
    m.appendChild(el("div", "bubble", text));
    thread.appendChild(m); scroll();
  }

  function agentContainer() {
    const m = el("div", "msg agent");
    m.appendChild(el("span", "au", "The Agent"));
    thread.appendChild(m);
    return m;
  }

  async function sendMsg() {
    const text = input.value.trim();
    if (!text || busy) return;
    document.getElementById("hello")?.remove();
    busy = true; send.disabled = true; input.value = "";
    addUser(text);

    const container = agentContainer();
    const think = el("div", "thinking"); think.append(el("i"), el("i"), el("i"));
    container.appendChild(think); scroll();
    let bubble = null;

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json",
                   "Authorization": "Bearer " + token() },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      if (resp.status === 401 || resp.status === 403) {
        think.remove();
        const d = await resp.json().catch(() => ({}));
        gate(d.detail || "Your link expired — reopen The Agent from the AI Hub menu.");
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          if (!chunk.startsWith("data: ")) continue;
          let ev;
          try { ev = JSON.parse(chunk.slice(6)); } catch { continue; }
          think.remove();
          if (ev.type === "text") {
            if (!bubble) { bubble = el("div", "bubble"); container.appendChild(bubble); }
            bubble.textContent += (bubble.textContent ? "\n\n" : "") + ev.text;
          } else if (ev.type === "tool") {
            bubble = null;
            const chip = el("div", "toolchip");
            chip.appendChild(el("span", "dot"));
            const name = (ev.name || "").replace("mcp__aihub__", "");
            chip.appendChild(document.createTextNode(
              name + " " + JSON.stringify(ev.input || {})));
            container.appendChild(chip);
          } else if (ev.type === "result") {
            if (ev.session_id) {
              sessionId = ev.session_id;
              sessionStorage.setItem("agent_session", sessionId);
            }
            if (!ev.ok) container.appendChild(
              el("span", "meta err", "turn ended: " + ev.subtype));
          } else if (ev.type === "error") {
            container.appendChild(el("span", "meta err", "error: " + ev.error));
          }
          scroll();
        }
      }
    } catch (e) {
      think.remove();
      container.appendChild(el("span", "meta err", "connection error: " + e.message));
    } finally {
      busy = false; send.disabled = false; input.focus(); scroll();
    }
  }

  send.onclick = sendMsg;
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  document.getElementById("newchat").onclick = () => {
    sessionId = null; sessionStorage.removeItem("agent_session");
    thread.innerHTML = ""; boot();
  };

  async function boot() {
    if (!token()) { gate("No access token. Use the AI Hub menu → The Agent."); return; }
    try {
      const r = await fetch("/api/me", { headers: { Authorization: "Bearer " + token() } });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        gate(d.detail || "Your link expired — reopen The Agent from the AI Hub menu.");
        return;
      }
      const d = await r.json();
      document.getElementById("who").innerHTML =
        `signed in as <b>${d.user.name || d.user.username}</b>`;
      document.getElementById("model").textContent = "brain: " + d.model;
      input.disabled = false; send.disabled = false;
      hello(d.user); input.focus();
    } catch (e) {
      gate("The Agent service is unreachable: " + e.message);
    }
  }
  boot();
})();
</script>
</body>
</html>
