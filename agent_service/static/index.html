<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Agent — AI Hub</title>
<style>
  :root {
    --bg:#0B0F14; --panel:#10161D; --raised:#151D26; --hover:#1A2430;
    --line:#1E2933; --line-soft:#18212B;
    --text:#E4ECF3; --text2:#93A2B0; --text3:#5C6B7A;
    --accent:#41D0C1; --accent-ink:#0B0F14;
    --accent-tint:rgba(65,208,193,.12); --accent-line:rgba(65,208,193,.35);
    --amber:#E5B663; --amber-tint:rgba(229,182,99,.12);
    --red:#E0716B; --red-tint:rgba(224,113,107,.12);
    --green:#5AC488; --green-tint:rgba(90,196,136,.12);
    --blue:#6FB1E8; --blue-tint:rgba(111,177,232,.12);
    --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;
       line-height:1.55;color-scheme:dark;display:flex}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  textarea,input[type=text]{background:var(--raised);border:1px solid var(--line);border-radius:10px;
       color:var(--text);font:inherit;padding:9px 12px;outline:none;width:100%}
  textarea:focus,input[type=text]:focus{border-color:var(--accent-line)}
  ::placeholder{color:var(--text3)}

  /* ===== rail ===== */
  .rail{width:198px;flex:none;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;gap:4px;padding:16px 10px;height:100vh;position:sticky;top:0}
  .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px}
  .mark{width:26px;height:26px;border-radius:7px;flex:none;
        background:linear-gradient(135deg,var(--accent),#2A8F86);
        display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:13px}
  .brand b{font-size:14px;font-weight:650}
  .navlink{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
           color:var(--text2);font-weight:520;width:100%;text-align:left;font-size:13px}
  .navlink:hover{background:var(--hover);color:var(--text)}
  .navlink.on{background:var(--accent-tint);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
  .navlink .count{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;
                  background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
  .rail .spacer{flex:1}
  .who{padding:10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--text3)}
  .who b{color:var(--text2);font-weight:550;display:block;font-size:12px}
  .model-note{font-family:var(--mono);font-size:9px;color:var(--text3);padding:4px 10px}

  /* ===== views ===== */
  .view{flex:1;display:none;flex-direction:column;height:100vh;min-width:0}
  .view.on{display:flex}

  /* ===== chat view ===== */
  #chat-main{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .thread{max-width:800px;margin:0 auto;padding:24px 20px 40px;display:flex;flex-direction:column;gap:14px}
  .hello{color:var(--text2);text-align:center;margin-top:8vh}
  .hello h1{font-size:21px;font-weight:650;color:var(--text);margin-bottom:8px}
  .hello p{max-width:52ch;margin:0 auto 16px}
  .starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .starter{border:1px solid var(--line);background:var(--panel);border-radius:999px;
           padding:7px 14px;font-size:12.5px;color:var(--text2)}
  .starter:hover{border-color:var(--accent-line);color:var(--text)}
  .msg{display:flex;flex-direction:column;gap:6px;animation:rise .18s ease}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.msg{animation:none}}
  .au{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text3);text-transform:uppercase}
  .msg.user{align-items:flex-end}
  .msg.user .bubble{background:var(--accent-tint);border:1px solid var(--accent-line);
                    border-radius:14px 14px 4px 14px;max-width:70%}
  .msg.agent .bubble{background:var(--panel);border:1px solid var(--line);
                     border-radius:14px 14px 14px 4px;max-width:88%}
  .bubble{padding:11px 15px;white-space:pre-wrap;overflow-wrap:anywhere}
  .toolchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);
            font-size:10.5px;color:var(--text3);border:1px solid var(--line-soft);
            border-radius:7px;padding:4px 10px;background:var(--raised);max-width:88%;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toolchip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .meta{font-family:var(--mono);font-size:9.5px;color:var(--text3)}
  .meta.err{color:var(--red)}
  .thinking{display:inline-flex;gap:5px;padding:12px 15px}
  .thinking i{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:pulse 1.1s ease-in-out infinite}
  .thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  #chat-footer{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:13px 20px}
  .inputrow{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  .inputrow textarea{resize:none;min-height:44px;max-height:160px}
  .send{background:var(--accent);color:var(--accent-ink);font-weight:650;border-radius:11px;
        padding:11px 20px;flex:none}
  .send:disabled{opacity:.4;cursor:default}
  .foot-note{max-width:800px;margin:7px auto 0;font-size:10px;color:var(--text3);
             font-family:var(--mono);display:flex;justify-content:space-between}
  .gate{margin:12vh auto 0;max-width:420px;text-align:center;color:var(--text2)}
  .gate h1{font-size:18px;color:var(--text);margin-bottom:8px}
  .newchat{border:1px solid var(--line);border-radius:8px;padding:4px 11px;color:var(--text2);font-size:11.5px}
  .newchat:hover{border-color:var(--accent-line);color:var(--text)}

  /* ===== work view ===== */
  #work-head{display:flex;align-items:center;gap:14px;padding:16px 22px 0}
  #work-head h1{font-size:17px;font-weight:650}
  #work-head .sub{color:var(--text3);font-size:12px}
  #work-refresh{margin-left:auto;border:1px solid var(--line);border-radius:8px;
                padding:5px 12px;color:var(--text2);font-size:12px}
  #work-refresh:hover{border-color:var(--accent-line);color:var(--text)}
  .chips{display:flex;gap:7px;margin:12px 22px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
        border:1px solid var(--line);color:var(--text2);font-size:11.5px;font-weight:550;background:var(--panel)}
  .chip:hover{border-color:var(--text3);color:var(--text)}
  .chip.on{border-color:var(--accent-line);background:var(--accent-tint);color:var(--text)}
  .chip .n{font-family:var(--mono);font-size:10px;color:var(--text3)}
  .chip.on .n{color:var(--accent)}
  #work-body{flex:1;display:grid;grid-template-columns:355px 1fr;gap:14px;
             padding:0 22px 22px;overflow:hidden;min-height:0}
  #work-queue{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
  .qitem{background:var(--panel);border:1px solid var(--line);border-radius:11px;
         padding:10px 13px;width:100%;text-align:left;display:block}
  .qitem:hover{background:var(--hover)}
  .qitem.on{border-color:var(--accent-line);background:var(--raised);box-shadow:inset 3px 0 0 var(--accent)}
  .qrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .tchip{font-size:9.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
         border-radius:5px;padding:2px 7px}
  .t-approve_deny{color:var(--amber);background:var(--amber-tint)}
  .t-edit_and_return{color:var(--blue);background:var(--blue-tint)}
  .t-provide_input{color:var(--accent);background:var(--accent-tint)}
  .t-review{color:var(--green);background:var(--green-tint)}
  .t-acknowledge{color:var(--text3);background:var(--raised)}
  .t-do_offline{color:var(--text2);background:var(--raised)}
  .qmeta{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--text3)}
  .qtitle{font-weight:570;font-size:12.5px;line-height:1.35}
  .qfrom{color:var(--text3);font-size:11px;margin-top:2px}
  .qfrom .shared{color:var(--blue)}
  #work-empty{color:var(--text3);text-align:center;margin-top:8vh;font-size:13px}
  #work-detail{overflow-y:auto;background:var(--panel);border:1px solid var(--line);
               border-radius:13px;padding:18px 20px}
  .crumb{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.03em;margin-bottom:8px;
         text-transform:uppercase}
  .dtitle{font-size:15.5px;font-weight:640;margin-bottom:6px}
  .dsummary{color:var(--text2);font-size:13px;white-space:pre-wrap}
  .dsection{margin-top:15px}
  .dlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
          color:var(--text3);margin-bottom:7px}
  .kv{font-size:12.5px;color:var(--text2)}
  .kv b{color:var(--text)}
  .mailrow{display:flex;gap:10px;padding:2px 0;font-size:12.5px}
  .mailrow .k{font-family:var(--mono);font-size:10px;color:var(--text3);width:56px;flex:none;padding-top:2px}
  .actions{display:flex;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);
           flex-wrap:wrap;align-items:center}
  .btn{border-radius:9px;padding:8px 15px;font-weight:600;font-size:12.5px;
       border:1px solid var(--line);color:var(--text2)}
  .btn:hover{border-color:var(--text3);color:var(--text)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}
  .btn:disabled{opacity:.4;cursor:default}
  .hint{font-size:10.5px;color:var(--text3);font-style:italic;margin-left:auto}
  .claimbar{display:flex;align-items:center;gap:12px;background:var(--blue-tint);
            border:1px solid rgba(111,177,232,.35);border-radius:10px;padding:9px 13px;
            margin-top:12px;font-size:12px}
  .claimbar.mine{background:var(--accent-tint);border-color:var(--accent-line)}
  .claimbar .st{font-weight:600;color:var(--blue)}
  .claimbar.mine .st{color:var(--accent)}
  .claimbar button{margin-left:auto}
  .thread-box{display:flex;flex-direction:column;gap:8px}
  .tmsg{max-width:60ch;border-radius:10px;padding:8px 12px;font-size:12px}
  .tmsg .au{margin-bottom:3px}
  .tmsg.human{background:var(--raised);border:1px solid var(--line)}
  .tmsg.agent{background:var(--accent-tint);border:1px solid var(--accent-line);margin-left:18px;
              white-space:pre-wrap}
  .threadrow{display:flex;gap:8px;margin-top:8px}
  .ok-note{color:var(--green);font-size:12px;margin-top:8px}
  .err-note{color:var(--red);font-size:12px;margin-top:8px}
</style>
</head>
<body>

<nav class="rail">
  <div class="brand"><div class="mark">A</div><b>The Agent</b></div>
  <button class="navlink on" id="nav-chat">◇ Assistant</button>
  <button class="navlink" id="nav-work">▣ My Work <span class="count" id="work-count" style="display:none">0</span></button>
  <button class="navlink" id="nav-skills">◆ Skills</button>
  <div class="spacer"></div>
  <div class="model-note" id="model"></div>
  <div class="who" id="who"></div>
</nav>

<!-- ===================== ASSISTANT ===================== -->
<section class="view on" id="view-chat">
  <div id="chat-main"><div class="thread" id="thread"></div></div>
  <div id="chat-footer">
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="Ask, analyze, build, schedule…"></textarea>
      <button class="send" id="send">Send</button>
      <button class="newchat" id="newchat" title="Start fresh">New</button>
    </div>
    <div class="foot-note"><span>draft → dry-run → promote → schedule</span>
      <span>humans stay in the loop · My Work</span></div>
  </div>
</section>

<!-- ===================== MY WORK ===================== -->
<section class="view" id="view-work">
  <div id="work-head">
    <h1>My Work</h1><span class="sub">Everything waiting on you</span>
    <button id="work-refresh">↻ Refresh</button>
  </div>
  <div class="chips" id="work-chips"></div>
  <div id="work-body">
    <div id="work-queue"></div>
    <div id="work-detail"><div id="work-empty">Select an item — or enjoy the empty queue.</div></div>
  </div>
</section>

<!-- ===================== SKILLS ===================== -->
<section class="view" id="view-skills">
  <div id="work-head" style="padding:16px 22px 0;display:flex;align-items:center;gap:14px">
    <h1 style="font-size:17px;font-weight:650">Skills</h1>
    <span class="sub" style="color:var(--text3);font-size:12px">Procedural memory — what your sessions know how to do</span>
    <button id="skills-refresh" style="margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:5px 12px;color:var(--text2);font-size:12px">↻ Refresh</button>
  </div>
  <div id="skills-body" style="flex:1;display:grid;grid-template-columns:355px 1fr;gap:14px;padding:14px 22px 22px;overflow:hidden;min-height:0">
    <div id="skills-list" style="overflow-y:auto;display:flex;flex-direction:column;gap:8px"></div>
    <div id="skills-detail" style="overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px">
      <div style="color:var(--text3);text-align:center;margin-top:8vh;font-size:13px">Select a skill.</div>
    </div>
  </div>
</section>

<script>
(() => {
  // ---------- auth ----------
  const params = new URLSearchParams(location.search);
  if (params.get("token")) {
    localStorage.setItem("agent_token", params.get("token"));
    history.replaceState({}, "", location.pathname);
  }
  const token = () => localStorage.getItem("agent_token") || "";
  const H = () => ({ "Content-Type": "application/json",
                     "Authorization": "Bearer " + token() });

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  // ---------- view switching ----------
  const views = { chat: document.getElementById("view-chat"),
                  work: document.getElementById("view-work"),
                  skills: document.getElementById("view-skills") };
  const navs = { chat: document.getElementById("nav-chat"),
                 work: document.getElementById("nav-work"),
                 skills: document.getElementById("nav-skills") };
  function show(v) {
    for (const k of Object.keys(views)) {
      views[k].classList.toggle("on", k === v);
      navs[k].classList.toggle("on", k === v);
    }
    if (v === "work") loadWork();
    if (v === "skills") loadSkills();
  }
  navs.chat.onclick = () => show("chat");
  navs.work.onclick = () => show("work");
  navs.skills.onclick = () => show("skills");

  // ---------- skills view ----------
  const SCOPE_STYLE = { product: "t-acknowledge", tenant: "t-provide_input",
                        group: "t-edit_and_return", user: "t-review" };
  async function loadSkills() {
    const list = document.getElementById("skills-list");
    const detail = document.getElementById("skills-detail");
    list.innerHTML = "Loading…";
    try {
      const r = await fetch("/api/skills", { headers: H() });
      const d = await r.json();
      list.innerHTML = "";
      if (!(d.skills || []).length) {
        list.appendChild(el("div", "qfrom",
          "No skills yet — the agent saves them as it learns, or ask it to."));
        return;
      }
      d.skills.forEach(s => {
        const b = el("button", "qitem");
        const row = el("div", "qrow");
        row.appendChild(el("span", "tchip " + (SCOPE_STYLE[s.scope] || ""),
          s.scope + (s.group_id ? " " + s.group_id : "")));
        row.appendChild(el("span", "qmeta", (s.size || 0) + " B"));
        b.appendChild(row);
        b.appendChild(el("div", "qtitle", s.name));
        b.appendChild(el("div", "qfrom", s.description || ""));
        b.onclick = async () => {
          detail.innerHTML = "Loading…";
          const q = `scope=${s.scope}&name=${encodeURIComponent(s.name)}` +
                    (s.group_id ? `&group_id=${s.group_id}` : "");
          const rr = await fetch(`/api/skills/read?${q}`, { headers: H() });
          const dd = await rr.json().catch(() => ({}));
          detail.innerHTML = "";
          detail.appendChild(el("div", "crumb", `${s.scope} skill`));
          detail.appendChild(el("div", "dtitle", s.name));
          const pre = el("div", "kv");
          pre.textContent = dd.content || "(unreadable)";
          pre.style.cssText = "font-family:var(--mono);font-size:11.5px;" +
            "white-space:pre-wrap;margin-top:10px";
          detail.appendChild(pre);
          if (s.scope !== "product") {
            const acts = el("div", "actions");
            const del = el("button", "btn danger", "Delete skill");
            del.onclick = async () => {
              if (!confirm(`Delete skill '${s.name}' (${s.scope})?`)) return;
              const dr = await fetch("/api/skills/delete", { method: "POST",
                headers: H(), body: JSON.stringify({ scope: s.scope,
                  name: s.name, group_id: s.group_id || 0 }) });
              if (dr.ok) loadSkills();
              else note(detail, "err-note",
                (await dr.json().catch(() => ({}))).detail || "delete failed");
            };
            acts.appendChild(del);
            detail.appendChild(acts);
          }
        };
        list.appendChild(b);
      });
    } catch (e) { list.textContent = "Could not load: " + e.message; }
  }
  document.getElementById("skills-refresh").onclick = loadSkills;

  // =====================================================
  // ASSISTANT (chat) — unchanged mechanics from A0/A1
  // =====================================================
  const thread = document.getElementById("thread");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const chatMain = document.getElementById("chat-main");
  let sessionId = sessionStorage.getItem("agent_session") || null;
  let busy = false;
  const scroll = () => { chatMain.scrollTop = chatMain.scrollHeight; };

  function gate(msg) {
    thread.innerHTML = "";
    const g = el("div", "gate");
    g.appendChild(el("h1", "", "Open The Agent from AI Hub"));
    g.appendChild(el("p", "", msg));
    thread.appendChild(g);
    input.disabled = true; send.disabled = true;
  }
  function hello(user) {
    const h = el("div", "hello"); h.id = "hello";
    h.appendChild(el("h1", "", `Hi ${user.name || user.username} — what do you need?`));
    h.appendChild(el("p", "", "Explore your data, build automations through conversation, and keep humans in the loop with My Work."));
    const s = el("div", "starters");
    ["What data connections do we have?",
     "Build me an automation that checks ERPDB daily",
     "What's waiting in My Work?"].forEach(q => {
      const b = el("button", "starter", q);
      b.onclick = () => { input.value = q; sendMsg(); };
      s.appendChild(b);
    });
    h.appendChild(s); thread.appendChild(h);
  }
  function addUser(text) {
    const m = el("div", "msg user");
    m.appendChild(el("span", "au", "You"));
    m.appendChild(el("div", "bubble", text));
    thread.appendChild(m); scroll();
  }
  async function sendMsg() {
    const text = input.value.trim();
    if (!text || busy) return;
    document.getElementById("hello")?.remove();
    busy = true; send.disabled = true; input.value = ""; input.style.height = "auto";
    addUser(text);
    const container = el("div", "msg agent");
    container.appendChild(el("span", "au", "The Agent"));
    thread.appendChild(container);
    const think = el("div", "thinking"); think.append(el("i"), el("i"), el("i"));
    container.appendChild(think); scroll();
    let bubble = null;
    try {
      const resp = await fetch("/api/chat", { method: "POST", headers: H(),
        body: JSON.stringify({ message: text, session_id: sessionId }) });
      if (resp.status === 401 || resp.status === 403) {
        think.remove();
        const d = await resp.json().catch(() => ({}));
        gate(d.detail || "Session expired — reopen from AI Hub."); return;
      }
      const reader = resp.body.getReader();
      const dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          if (!chunk.startsWith("data: ")) continue;
          let ev; try { ev = JSON.parse(chunk.slice(6)); } catch { continue; }
          think.remove();
          if (ev.type === "text") {
            if (!bubble) { bubble = el("div", "bubble"); container.appendChild(bubble); }
            bubble.textContent += (bubble.textContent ? "\n\n" : "") + ev.text;
          } else if (ev.type === "tool") {
            bubble = null;
            const chip = el("div", "toolchip");
            chip.appendChild(el("span", "dot"));
            chip.appendChild(document.createTextNode(
              (ev.name || "").replace("mcp__aihub__", "") + " " +
              JSON.stringify(ev.input || {})));
            container.appendChild(chip);
          } else if (ev.type === "result") {
            if (ev.session_id) { sessionId = ev.session_id;
              sessionStorage.setItem("agent_session", sessionId); }
            if (!ev.ok) container.appendChild(el("span", "meta err",
              "turn ended: " + ev.subtype));
          } else if (ev.type === "error") {
            container.appendChild(el("span", "meta err", "error: " + ev.error));
          }
          scroll();
        }
      }
    } catch (e) {
      think.remove();
      container.appendChild(el("span", "meta err", "connection error: " + e.message));
    } finally {
      busy = false; send.disabled = false; input.focus(); scroll();
      refreshWorkCount();
    }
  }
  send.onclick = sendMsg;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
  document.getElementById("newchat").onclick = () => {
    sessionId = null; sessionStorage.removeItem("agent_session");
    thread.innerHTML = ""; boot(); };

  // =====================================================
  // MY WORK
  // =====================================================
  const queueEl = document.getElementById("work-queue");
  const detailEl = document.getElementById("work-detail");
  const chipsEl = document.getElementById("work-chips");
  let workItems = [], workFilter = "all", selected = null, me = null;

  const VERB_LABEL = { approve_deny: "✓ Approval", edit_and_return: "✎ Email / Edit",
                       provide_input: "? Question", review: "◇ Review",
                       acknowledge: "◦ FYI", do_offline: "☐ Task" };

  async function refreshWorkCount() {
    try {
      const r = await fetch("/api/work/list", { headers: H() });
      if (!r.ok) return;
      const d = await r.json();
      const c = document.getElementById("work-count");
      c.textContent = d.total; c.style.display = d.total ? "" : "none";
    } catch {}
  }

  async function loadWork() {
    queueEl.innerHTML = ""; detailEl.innerHTML = "";
    detailEl.appendChild(el("div", "", "Loading…"));
    try {
      const r = await fetch("/api/work/list", { headers: H() });
      const d = await r.json();
      workItems = d.items || [];
      const c = document.getElementById("work-count");
      c.textContent = d.total; c.style.display = d.total ? "" : "none";
      renderChips(); renderQueue();
      detailEl.innerHTML = "";
      detailEl.appendChild(el("div", "", "")).id = "work-empty";
      document.getElementById("work-empty").textContent = workItems.length
        ? "Select an item." : "Nothing is waiting on you. Enjoy it.";
    } catch (e) {
      detailEl.textContent = "Could not load: " + e.message;
    }
  }
  document.getElementById("work-refresh").onclick = loadWork;

  function renderChips() {
    chipsEl.innerHTML = "";
    const counts = {};
    workItems.forEach(i => counts[i.verb] = (counts[i.verb] || 0) + 1);
    const mk = (key, label, n) => {
      const b = el("button", "chip" + (workFilter === key ? " on" : ""));
      b.appendChild(document.createTextNode(label + " "));
      b.appendChild(el("span", "n", String(n)));
      b.onclick = () => { workFilter = key; renderChips(); renderQueue(); };
      chipsEl.appendChild(b);
    };
    mk("all", "All", workItems.length);
    Object.entries(VERB_LABEL).forEach(([v, label]) => {
      if (counts[v]) mk(v, label.replace(/^[^ ]+ /, ""), counts[v]);
    });
  }

  function renderQueue() {
    queueEl.innerHTML = "";
    const list = workItems.filter(i => workFilter === "all" || i.verb === workFilter);
    if (!list.length) queueEl.appendChild(el("div", "qfrom", "No items in this filter."));
    list.forEach(item => {
      const b = el("button", "qitem" + (selected === item ? " on" : ""));
      const row = el("div", "qrow");
      row.appendChild(el("span", "tchip t-" + item.verb,
                         VERB_LABEL[item.verb] || item.verb));
      row.appendChild(el("span", "qmeta",
                         (item.requested_at || "").slice(0, 16).replace("T", " ")));
      b.appendChild(row);
      b.appendChild(el("div", "qtitle", item.title));
      const from = el("div", "qfrom");
      from.textContent = "from " + (item.from || item.source);
      if (item.source === "agent" && !item.addressed_user) {
        const s = el("span", "shared",
          item.status === "claimed" ? " · claimed by you" : " · shared, unclaimed");
        from.appendChild(s);
      }
      b.appendChild(from);
      b.onclick = () => { selected = item; renderQueue(); renderDetail(item); };
      queueEl.appendChild(b);
    });
  }

  function note(parent, cls, text) {
    parent.querySelectorAll(".ok-note,.err-note").forEach(n => n.remove());
    parent.appendChild(el("div", cls, text));
  }

  async function post(path, body, host, okMsg) {
    try {
      const r = await fetch(path, { method: "POST", headers: H(),
                                    body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { note(host, "err-note", d.detail || "failed"); return null; }
      note(host, "ok-note", okMsg); await loadWork(); return d;
    } catch (e) { note(host, "err-note", e.message); return null; }
  }

  function commentBox(ph) {
    const t = el("textarea"); t.rows = 2; t.placeholder = ph || "Optional comment…";
    return t;
  }

  function renderDetail(item) {
    detailEl.innerHTML = "";
    detailEl.appendChild(el("div", "crumb",
      `${item.source} · ${item.verb.replace("_", " ")} · raised ${item.requested_at || ""}`));
    detailEl.appendChild(el("div", "dtitle", item.title));
    if (item.summary) detailEl.appendChild(el("div", "dsummary", item.summary));

    const p = item.payload || {};
    const actions = el("div", "actions");

    if (item.source === "email") {
      const sec = el("div", "dsection");
      sec.appendChild(el("div", "dlabel", "Draft — body is editable; what you approve is what sends"));
      const toRow = el("div", "mailrow");
      toRow.appendChild(el("span", "k", "TO"));
      toRow.appendChild(el("span", "kv", (p.to || []).join(", ")));
      const subRow = el("div", "mailrow");
      subRow.appendChild(el("span", "k", "SUBJECT"));
      subRow.appendChild(el("span", "kv", p.subject || ""));
      sec.append(toRow, subRow);
      const body = el("textarea"); body.rows = 10; body.value = p.body || "";
      sec.appendChild(body);
      detailEl.appendChild(sec);
      const cm = commentBox();
      const capprove = el("button", "btn primary", "Approve & send");
      capprove.onclick = () => post("/api/work/decide",
        { source: "email", id: item.id, decision: "approve",
          final_body: body.value, comments: cm.value, title: item.title },
        detailEl, "Sent.");
      const creject = el("button", "btn danger", "Reject");
      creject.onclick = () => post("/api/work/decide",
        { source: "email", id: item.id, decision: "reject",
          comments: cm.value, title: item.title }, detailEl, "Rejected.");
      const cs = el("div", "dsection"); cs.appendChild(cm); detailEl.appendChild(cs);
      actions.append(capprove, creject);
      actions.appendChild(el("span", "hint", "Nothing sends without you"));
    } else if (item.source === "workflow" || item.source === "automation") {
      const sec = el("div", "dsection");
      sec.appendChild(el("div", "dlabel", "Context"));
      const kv = el("div", "kv");
      if (item.source === "automation") {
        kv.innerHTML = `automation <b>${p.automation_id || "?"}</b>` +
          (p.run_id ? ` · run <b>${p.run_id}</b>` : "") +
          (p.dry_run ? " · dry-run" : "") +
          ((p.attachments || []).length
            ? `<br>attachments: ${(p.attachments || []).map(a => a.name).join(", ")}` : "");
      } else {
        kv.innerHTML = Object.entries(p).slice(0, 8)
          .map(([k, v]) => `${k}: <b>${String(v).slice(0, 120)}</b>`).join("<br>") ||
          "(no extra data)";
      }
      sec.appendChild(kv); detailEl.appendChild(sec);
      const cm = commentBox();
      const cs = el("div", "dsection"); cs.appendChild(cm); detailEl.appendChild(cs);
      const ok = el("button", "btn primary",
                    item.source === "automation" ? "Approve — proceed" : "Approve");
      ok.onclick = () => post("/api/work/decide",
        { source: item.source, id: item.id, decision: "approved",
          comments: cm.value, title: item.title },
        detailEl, "Approved — the paused run resumes.");
      const no = el("button", "btn danger",
                    item.source === "automation" ? "Reject — abort" : "Reject");
      no.onclick = () => post("/api/work/decide",
        { source: item.source, id: item.id, decision: "rejected",
          comments: cm.value, title: item.title }, detailEl, "Rejected.");
      actions.append(ok, no);
      actions.appendChild(el("span", "hint", "Your decision resumes the paused run"));
    } else {
      // agent-raised items
      if (!item.addressed_user) {
        const bar = el("div", "claimbar" + (item.status === "claimed" ? " mine" : ""));
        bar.appendChild(el("span", "st",
          item.status === "claimed" ? "Claimed by you" : "Unclaimed"));
        bar.appendChild(el("span", "kv",
          item.status === "claimed" ? "hidden from others while you hold it"
                                    : "shared — claim to work it"));
        const cb = el("button", "btn",
          item.status === "claimed" ? "Release claim" : "Claim this item");
        cb.onclick = () => post(
          item.status === "claimed" ? "/api/work/release" : "/api/work/claim",
          { id: item.id }, detailEl,
          item.status === "claimed" ? "Released." : "Claimed.");
        bar.appendChild(cb);
        detailEl.appendChild(bar);
      }
      if (Object.keys(p).length) {
        const sec = el("div", "dsection");
        sec.appendChild(el("div", "dlabel", "Payload"));
        const pre = el("div", "kv");
        pre.textContent = JSON.stringify(p, null, 1).slice(0, 1500);
        pre.style.fontFamily = "var(--mono)"; pre.style.fontSize = "11px";
        pre.style.whiteSpace = "pre-wrap";
        sec.appendChild(pre); detailEl.appendChild(sec);
      }
      const cs = el("div", "dsection");
      let answer = null;
      if (item.verb === "provide_input" || item.verb === "edit_and_return") {
        answer = el("textarea"); answer.rows = 4;
        answer.placeholder = item.verb === "provide_input"
          ? "Your answer…" : "Your edited version…";
        cs.appendChild(answer);
      }
      const cm = commentBox(); cs.appendChild(cm); detailEl.appendChild(cs);
      const respond = (decision) => post("/api/work/respond",
        { id: item.id, response: { decision, text: answer ? answer.value : "",
                                   comments: cm.value } },
        detailEl, "Recorded — item closed.");
      if (item.verb === "approve_deny") {
        const a = el("button", "btn primary", "Approve"); a.onclick = () => respond("approved");
        const d = el("button", "btn danger", "Deny"); d.onclick = () => respond("denied");
        actions.append(a, d);
      } else if (item.verb === "provide_input" || item.verb === "edit_and_return") {
        const a = el("button", "btn primary", "Send response");
        a.onclick = () => respond("answered"); actions.append(a);
      } else if (item.verb === "do_offline") {
        const a = el("button", "btn primary", "Mark done");
        a.onclick = () => respond("done"); actions.append(a);
      } else {
        const a = el("button", "btn primary", "Acknowledge");
        a.onclick = () => respond("acknowledged"); actions.append(a);
      }
    }
    detailEl.appendChild(actions);

    // ---- side-thread (all items) ----
    const ts = el("div", "dsection");
    ts.appendChild(el("div", "dlabel", "Thread with the agent"));
    const box = el("div", "thread-box"); ts.appendChild(box);
    const row = el("div", "threadrow");
    const q = el("input"); q.type = "text"; q.placeholder = "Ask the agent about this item…";
    const ask = el("button", "btn", "Ask");
    row.append(q, ask); ts.appendChild(row);
    detailEl.appendChild(ts);

    function renderThread(msgs) {
      box.innerHTML = "";
      (msgs || []).forEach(m => {
        const d = el("div", "tmsg " + (m.role === "human" ? "human" : "agent"));
        d.appendChild(el("div", "au meta", m.role === "human" ? "You" : "The Agent"));
        d.appendChild(document.createTextNode(m.text));
        box.appendChild(d);
      });
    }
    fetch(`/api/work/thread?source=${item.source}&id=${encodeURIComponent(item.id)}`,
          { headers: H() }).then(r => r.json()).then(d => renderThread(d.thread))
      .catch(() => {});
    ask.onclick = async () => {
      const question = q.value.trim();
      if (!question) return;
      ask.disabled = true; ask.textContent = "…";
      try {
        const r = await fetch("/api/work/thread", { method: "POST", headers: H(),
          body: JSON.stringify({ source: item.source, id: item.id,
                                 question, title: item.title,
                                 context: item.payload }) });
        const d = await r.json();
        renderThread(d.thread); q.value = "";
      } catch (e) { note(ts, "err-note", e.message); }
      ask.disabled = false; ask.textContent = "Ask";
    };
  }

  // ---------- boot ----------
  async function boot() {
    if (!token()) { gate("No access token. Use the AI Hub menu → The Agent."); return; }
    try {
      const r = await fetch("/api/me", { headers: { Authorization: "Bearer " + token() } });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        gate(d.detail || "Session expired — reopen from AI Hub."); return;
      }
      const d = await r.json(); me = d.user;
      document.getElementById("who").innerHTML =
        `signed in as<b>${d.user.name || d.user.username}</b>`;
      document.getElementById("model").textContent = "brain: " + d.model;
      input.disabled = false; send.disabled = false;
      if (!document.getElementById("hello") && !thread.children.length) hello(d.user);
      input.focus(); refreshWorkCount();
    } catch (e) { gate("The Agent service is unreachable: " + e.message); }
  }
  boot();
})();
</script>
</body>
</html>
